<style>
:root{color-scheme:light;--bg:#fbf6e9;--card:#fffdf6;--tx:#14233d;--mut:#66789a;--bd:#d6e4f4;--ac:#2f7de1;--acl:#e3efff;--in:#2b8a57;--out:#c4533f;--okb:#e3f5ea;--kob:#fdeae6;--nv:#1e3a8a;--gold:#5b9bea;--pb:#e3efff;--pt:#1d4fa8;--pbd:#7fb2f5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(180deg,#e4f0ff 0,#fbf6e9 220px,#fbf6e9 100%) fixed;color:var(--tx)}
h2{font-size:17px;margin:0 0 10px;color:var(--nv)}
main{max-width:1100px;margin:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 12px calc(110px + env(safe-area-inset-bottom,0px))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 2px 10px rgba(30,58,138,.08)}
.card.tight{padding:14px 8px}
.card.tight h2{padding:0 6px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.row label{flex:1 1 140px}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:3px}
input,select{font:inherit;padding:8px;border:1px solid var(--bd);border-radius:10px;background:#fffaf0;color:var(--tx);min-width:0}
.btn{padding:9px 16px;border:0;border-radius:10px;background:#1e3a8a;color:#a9d4ff;font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:var(--acl);color:var(--pt)}
.btn.sm{padding:3px 8px;font-size:12px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;border-bottom:1px solid var(--bd);text-align:center;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--mut);font-weight:600}
td.l{text-align:left}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px 18px;box-shadow:0 2px 10px rgba(30,58,138,.08)}
.kpi small{color:var(--mut);display:block}.kpi b{font-size:22px}
.in{color:var(--in)}.out{color:var(--out)}
.months{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px;padding:0 6px}
.months button{padding:6px 12px;border:1px solid var(--bd);border-radius:20px;background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
.months button.on{background:#1e3a8a;color:#a9d4ff;border-color:#1e3a8a}
.cell{width:38px;height:34px;border:1px solid var(--bd);border-radius:9px;background:#fffaf0;color:var(--mut);font:inherit;font-weight:700;cursor:pointer}
.cell.P{background:var(--okb);color:var(--in);border-color:var(--in)}
.cell.A{background:var(--kob);color:var(--out);border-color:var(--out)}
.hint{color:var(--mut);font-size:13px;margin:0 0 10px}
.pill{display:inline-block;min-width:26px;padding:2px 8px;border-radius:12px;font-weight:700}
.pill.P{background:var(--okb);color:var(--in)}.pill.A{background:var(--kob);color:var(--out)}
.d{font-size:11px;color:var(--mut);display:block;font-weight:400}
.hidden{display:none}

/* registro presenze */
.reg{table-layout:fixed;width:100%}
.reg th,.reg td{padding:6px 1px;white-space:normal;vertical-align:middle}
.reg th:first-child,.reg td:first-child{width:86px;padding-left:6px;position:sticky;left:0;background:var(--card);z-index:1}
.reg th{line-height:1.15;font-size:11px}
.reg th .d{font-size:9.5px}
.reg .cell{width:100%;max-width:38px;min-width:0;height:34px;padding:0;border-radius:8px}
.allbtn{width:24px;height:22px;margin-top:4px;padding:0;border:0;border-radius:7px;background:var(--okb);color:var(--in);font:inherit;font-size:11px;font-weight:800;cursor:pointer}
.sn{display:block;font-size:11.5px;line-height:1.1;white-space:nowrap;letter-spacing:-.2px}
.gn{display:block;font-size:11px;color:var(--mut);line-height:1.2;white-space:nowrap}
.mini{display:flex;gap:3px;margin:3px 0}
.mini .pill{min-width:0;padding:0 6px;font-size:11px;line-height:1.5}
.reg th:last-child,.reg td:last-child{width:36px;padding-left:2px;padding-right:4px}
.pay{width:100%;height:34px;line-height:1.1;padding:0;border:1px solid var(--pbd);border-radius:8px;background:#fff;color:var(--pt);font:inherit;font-size:10px;font-weight:700;cursor:pointer}
.pay svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;display:block;margin:auto}
.pay.on{background:#1e3a8a;border-color:#1e3a8a;color:#a9d4ff}
.pen{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block;margin:2px 3px}
.ex{font-size:10.5px;color:var(--mut)}

/* movimenti */
.mv{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.mv:last-child{border-bottom:0}
.mvl{min-width:0}.mvl b{display:block;word-break:break-word}
.nt{display:block;margin-top:3px;font-size:13px;color:var(--pt);background:var(--acl);padding:3px 8px;border-radius:8px;word-break:break-word}
.mvr{text-align:right;white-space:nowrap;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.tag{font-size:10.5px;color:var(--mut)}

/* barra in basso stile Dynamic Island */
nav{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;display:flex;gap:6px;padding:6px;border-radius:999px;background:rgba(255,252,242,.9);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid #c9dcf2;box-shadow:0 10px 28px rgba(30,58,138,.28),0 2px 6px rgba(0,0,0,.12)}
nav button{width:56px;height:46px;display:flex;align-items:center;justify-content:center;border:0;border-radius:999px;background:transparent;color:#7f9cc7;cursor:pointer;transition:width .25s ease,background .2s,color .2s}
nav button svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button.on{width:76px;background:#1e3a8a;color:#a9d4ff;box-shadow:0 4px 10px rgba(0,0,0,.3)}

/* benvenuto */
body.home nav{display:none}
.welcome{min-height:100vh;min-height:100dvh;margin-top:-20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;animation:wfade 1.1s ease both}
.wline{width:56px;height:1px;background:var(--gold)}
.wtitle{font-family:Georgia,'Palatino Linotype',Palatino,serif;font-weight:400;font-size:34px;line-height:1.25;color:#1e3a8a;margin:34px 0}
.wtitle small{display:block;font-size:12px;letter-spacing:6px;text-transform:uppercase;color:var(--ac);font-family:system-ui,-apple-system,sans-serif;font-weight:600;margin-bottom:14px}
.wenter{margin-top:46px;padding:13px 44px;border:0;border-radius:999px;background:#1e3a8a;color:#a9d4ff;font:inherit;font-size:13px;font-weight:600;letter-spacing:3px;text-transform:uppercase;cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.2)}
@keyframes wfade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.welcome{animation:none}}
</style>
</head>
<body>
<nav id="nav" aria-label="Sezioni">
  <button data-t="pn" aria-label="Piccole Note" title="Piccole Note"><svg viewBox="0 0 24 24"><path d="M9.5 17V6.5l10-2.2V15"/><path d="M9.5 9.2l10-2.2" stroke-width="3"/><ellipse cx="7" cy="17.3" rx="3" ry="2.3" fill="currentColor" transform="rotate(-20 7 17.3)"/><ellipse cx="17" cy="15.3" rx="3" ry="2.3" fill="currentColor" transform="rotate(-20 17 15.3)"/></svg></button>
  <button data-t="fin" aria-label="Portafoglio" title="Portafoglio"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h13v3"/><path d="M3 7v11a2 2 0 0 0 2 2h14a1 1 0 0 0 1-1V9a1 1 0 0 0-1-1H5a2 2 0 0 1-2-1z"/><circle cx="16.5" cy="14" r="1.2"/></svg></button>
  <button data-t="on" aria-label="Oltre le Note" title="Oltre le Note"><svg viewBox="0 0 24 24"><path d="M14.5 16.5V3.5"/><ellipse cx="11.8" cy="17.5" rx="3.4" ry="2.7" fill="currentColor" transform="rotate(-20 11.8 17.5)"/></svg></button>
</nav>
<main id="app"></main>

<script>
/* ===== CONFIGURAZIONE ===== */
const SEASON_START_YEAR = 2026;           // anno di inizio lezioni (novembre)
const MONTHS = [[0,10],[0,11],[1,0],[1,1],[1,2],[1,3],[1,4],[1,5]]; // [offset anno, mese 0-11]: nov → giu
const MN = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
const DN = ['Dom','Lun','Mar','Mer','Gio','Ven','Sab'];
const CHOIRS = {
  pn:{name:'Piccole Note', days:[6], people:['BOCCACCIO Virginia','COFFA Noemi','GIANNUSO Giulia','MARINO Emanuele','PASSARELLO Aurora'], exempt:[]},
  on:{name:'Oltre le Note', days:[2,6], people:['AUTERI Monica','BONAIUTO Alessandro','BONAIUTO Noemi','CAIA Annamaria','CAIA Lucrezia','CANCEMI Claudia','GRECO Matteo','SCOLLO Benedetta','TIRALONGO Giada'],
    exempt:['AUTERI Monica','CANCEMI Claudia','GRECO Matteo','TIRALONGO Giada','CAIA Annamaria']}
};
const CATS = ['Stipendio','Lezioni / Coro','Altre entrate','Casa','Spesa','Trasporti','Bollette','Svago','Salute','Altre uscite'];
// Giorni senza lezione oltre alle festività nazionali (formato AAAA-MM-GG), es. ponti o chiusure
const NO_LESSON = ['2027-01-02'];
const HOL = [[0,1],[0,2],[0,6],[3,25],[4,1],[5,2],[7,15],[10,1],[11,8],[11,25],[11,26]]; // [mese 0-11, giorno]
function easterMonday(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),
  h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
  mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1; return new Date(y,mo-1,da+1);}
function isHoliday(d){
  if(HOL.some(([m,g])=>d.getMonth()===m&&d.getDate()===g)) return true;
  const p=easterMonday(d.getFullYear()); if(p.getMonth()===d.getMonth()&&p.getDate()===d.getDate()) return true;
  return NO_LESSON.includes(iso(d));
}
const FEE = 20; // quota mensile in €
const KEY = 'gestionale-v1';

/* ===== STATO ===== */
let S = {fin:{start:0,items:[]}, pn:{att:{},pay:{},fee:0}, on:{att:{},pay:{},fee:0}};
try{ const r = localStorage.getItem(KEY); if(r) S = Object.assign(S, JSON.parse(r)); }catch(e){}
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} };
let tab='home', mIdx={pn:0,on:0};
if(!S.fin||!Array.isArray(S.fin.items)) S.fin={start:0,items:[]};

/* Mensilità pagate -> movimenti automatici nel portafoglio */
const niceName = n => { const [sn,...g]=n.split(' '); return (g.join(' ')+' '+sn.charAt(0)+sn.slice(1).toLowerCase()).trim(); };
const payDesc = ch => 'Mensilità Coro “'+CHOIRS[ch].name+'”';
const payNote = (ch,mk,i) => niceName(CHOIRS[ch].people[i])+' ha pagato la mensilità di '+MN[+mk.slice(5)-1]+' '+mk.slice(0,4);
function syncPayments(){
  const want={};
  ['pn','on'].forEach(ch=>{const C=CHOIRS[ch];
    Object.keys(S[ch].pay||{}).forEach(mk=>Object.keys(S[ch].pay[mk]).forEach(i=>{
      if(!S[ch].pay[mk][i]||C.exempt.includes(C.people[i])) return;
      want[ch+'|'+mk+'|'+i]={ch,mk,i};
    }));
  });
  const has={};
  S.fin.items=S.fin.items.filter(it=>{
    if(!it.link) return true;
    if(!want[it.link]||has[it.link]) return false;   // pagamento tolto (o doppione)
    has[it.link]=1;
    const [lc,lm,li]=it.link.split('|'); it.desc=payDesc(lc); if(it.note===undefined) it.note=payNote(lc,lm,li);
    return true;
  });
  Object.keys(want).forEach(k=>{
    if(has[k]) return;
    const {ch,mk,i}=want[k], C=CHOIRS[ch];
    S.fin.items.push({id:Date.now()+''+Math.random().toString(36).slice(2,6),link:k,date:iso(new Date()),type:'in',cat:'',
      desc:payDesc(ch),note:payNote(ch,mk,i),amt:FEE});
  });
  save();
}

/* ===== UTILITÀ ===== */
const $ = s => document.querySelector(s);
const eur = n => (n||0).toLocaleString('it-IT',{style:'currency',currency:'EUR'});
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const mKey = k => { const [o,m]=MONTHS[k]; return (SEASON_START_YEAR+o)+'-'+String(m+1).padStart(2,'0'); };
function lessons(ch,k){
  const [o,m]=MONTHS[k], y=SEASON_START_YEAR+o, out=[];
  for(let d=new Date(y,m,1); d.getMonth()===m; d.setDate(d.getDate()+1))
    if(CHOIRS[ch].days.includes(d.getDay())&&!isHoliday(d)) out.push(new Date(d));
  return out;
}
const monthLabel = k => MN[MONTHS[k][1]]+' '+(SEASON_START_YEAR+MONTHS[k][0]);

/* ===== NAVIGAZIONE ===== */
$('#nav').onclick = e => { const b=e.target.closest('button'); if(!b) return;
  tab=b.dataset.t; window.scrollTo(0,0); document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b)); render(); };

function render(){ document.body.classList.toggle('home',tab==='home'); tab==='home'?renderHome():tab==='fin'?renderFin():renderChoir(tab); }

/* ===== BENVENUTO ===== */
function renderHome(){
  $('#app').innerHTML=`<div class="welcome">
    <div class="wline"></div>
    <h2 class="wtitle"><small>Benvenuto</small>M° Francesco Bianca</h2>
    <div class="wline"></div>
    <button class="wenter" id="enter">Entra</button>
  </div>`;
  $('#enter').onclick=()=>document.querySelector('nav button[data-t="fin"]').click();
}

/* ===== 1) PORTAFOGLIO ===== */
function renderFin(){
  const items=S.fin.items.slice().sort((a,b)=>b.date.localeCompare(a.date));
  const tin=items.filter(i=>i.type==='in').reduce((s,i)=>s+i.amt,0);
  const tout=items.filter(i=>i.type==='out').reduce((s,i)=>s+i.amt,0);
  const months=[...new Set(items.map(i=>i.date.slice(0,7)))].sort();
  // riepilogo mensile con patrimonio cumulativo
  let run=0;
  const summary=months.map(m=>{
    const a=items.filter(i=>i.date.startsWith(m)&&i.type==='in').reduce((s,i)=>s+i.amt,0);
    const b=items.filter(i=>i.date.startsWith(m)&&i.type==='out').reduce((s,i)=>s+i.amt,0);
    run+=a-b; return {m,a,b,run};
  });
  $('#app').innerHTML=`
  <div class="kpis">
    <div class="kpi"><small>Entrate totali</small><b class="in">${eur(tin)}</b></div>
    <div class="kpi"><small>Uscite totali</small><b class="out">${eur(tout)}</b></div>
    <div class="kpi"><small>Patrimonio attuale</small><b>${eur(tin-tout)}</b></div>
  </div>
  <div class="card"><h2>Nuovo movimento</h2>
    <div class="row">
      <label>Data<input type="date" id="fd" value="${iso(new Date())}"></label>
      <label>Tipo<select id="ft"><option value="in">Entrata</option><option value="out">Uscita</option></select></label>
      <label>Descrizione<input id="fx" placeholder="es. Affitto"></label>
      <label>Importo (€)<input type="number" id="fa" step="0.01" min="0"></label>
      <label style="flex-basis:100%">Nota (facoltativa)<input id="fn" placeholder="es. pagato in contanti"></label>
      <button class="btn" id="fadd">Aggiungi</button>
    </div>
  </div>
  <div class="card"><h2>Riepilogo mensile</h2><div class="scroll"><table>
    <tr><th>Mese</th><th>Entrate</th><th>Uscite</th><th>Saldo</th><th>Patrimonio</th></tr>
    ${summary.map(r=>`<tr><td>${MN[+r.m.slice(5)-1]} ${r.m.slice(0,4)}</td><td class="in">${eur(r.a)}</td><td class="out">${eur(r.b)}</td><td>${eur(r.a-r.b)}</td><td><b>${eur(r.run)}</b></td></tr>`).join('')||'<tr><td colspan="5" class="l">Nessun movimento.</td></tr>'}
  </table></div></div>
  <div class="card"><h2>Movimenti</h2>
    ${items.map(i=>`<div class="mv"><div class="mvl"><b>${esc(i.desc||'Movimento')}</b><span class="d">${i.date.split('-').reverse().join('/')}</span>${i.note?`<span class="nt">${esc(i.note)}</span>`:''}</div>
      <div class="mvr"><b class="${i.type}">${i.type==='in'?'+':'−'}${eur(i.amt)}</b>
      <span><button class="btn sec sm" data-note="${i.id}" ${i.note?'aria-label="Modifica nota" title="Modifica nota"':''}>${i.note?'<svg class="pen" viewBox="0 0 24 24"><path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19z"/><path d="M14.5 6.5l3 3"/></svg>':'+ Nota'}</button>${i.link?'':` <button class="btn sec sm" data-del="${i.id}">Elimina</button>`}</span></div></div>`).join('')||'<p class="hint">Nessun movimento.</p>'}
  </div>
`;
  document.querySelectorAll('[data-note]').forEach(b=>b.onclick=()=>{
    const it=S.fin.items.find(x=>x.id===b.dataset.note); if(!it) return;
    const v=prompt('Nota del movimento:',it.note||''); if(v===null) return;
    if(v.trim()) it.note=v.trim(); else delete it.note; save(); renderFin(); });
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    if(!confirm('Eliminare questo movimento?')) return;
    S.fin.items=S.fin.items.filter(x=>x.id!==b.dataset.del); save(); renderFin(); });
  $('#fadd').onclick=()=>{
    const amt=parseFloat($('#fa').value); if(!(amt>0)||!$('#fd').value){alert('Inserisci data e importo valido.');return;}
    S.fin.items.push({id:Date.now()+''+Math.random().toString(36).slice(2,6),date:$('#fd').value,type:$('#ft').value,cat:'',desc:$('#fx').value,note:$('#fn').value.trim()||undefined,amt});
    save(); renderFin(); };
}

/* ===== 2 e 3) CORI ===== */
function counts(ch,i,k){ // presenze/assenze per corista; k = indice mese oppure null per tutta la stagione
  let p=0,a=0;
  (k===null?MONTHS.map((_,j)=>j):[k]).forEach(j=>lessons(ch,j).forEach(d=>{
    const v=(S[ch].att[iso(d)]||{})[i]; if(v==='P')p++; else if(v==='A')a++; }));
  return {p,a};
}
function renderChoir(ch){
  const sy=window.scrollY;
  const C=CHOIRS[ch], k=mIdx[ch], L=lessons(ch,k), mk=mKey(k), fee=FEE;
  $('#app').innerHTML=`
  <div class="card tight"><h2>Coro “${C.name}”</h2>
    <div class="months">${MONTHS.map((_,j)=>`<button data-m="${j}" class="${j===k?'on':''}">${MN[MONTHS[j][1]]}</button>`).join('')}</div>
    <div class="scroll"><table class="reg">
      <tr><th></th>${L.map(d=>`<th>${DN[d.getDay()]}<span class="d">${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}</span>
        <button class="allbtn" data-all="${iso(d)}" title="Tutti presenti">P</button></th>`).join('')}<th>€</th></tr>
      ${C.people.map((n,i)=>{const c=counts(ch,i,k);const ex=C.exempt.includes(n);const paid=(S[ch].pay[mk]||{})[i];const sp=n.indexOf(' ');return `<tr><td><b class="sn">${esc(n.slice(0,sp))}</b><span class="gn">${esc(n.slice(sp+1))}</span>
        <span class="mini"><span class="pill P">${c.p}</span><span class="pill A">${c.a}</span></span>
</td>
        ${L.map(d=>{const v=(S[ch].att[iso(d)]||{})[i]||'';return `<td><button class="cell ${v}" data-d="${iso(d)}" data-i="${i}">${v||'·'}</button></td>`;}).join('')}
        <td>${ex?'<span class="ex">Esonerato/a</span>':`<button class="pay ${paid?'on':''}" data-pay="${i}" data-on="${paid?1:0}" aria-label="${paid?'Mensilità pagata':'Mensilità da pagare'}" title="${paid?'Mensilità pagata':'Mensilità da pagare'}"><svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/><path d="M6 9.5v.01M18 14.5v.01"/></svg></button>`}</td></tr>`;}).join('')}
    </table></div>
    <p class="hint" style="margin:12px 6px 0">Quota mensile: <b>${eur(FEE)}</b> · Incassato a ${MN[MONTHS[k][1]]}: <b>${eur(C.people.filter((n,i)=>!C.exempt.includes(n)&&(S[ch].pay[mk]||{})[i]).length*FEE)}</b></p>
  </div>
  <div class="card"><h2>Registro Coro “${C.name}”</h2><div class="scroll"><table>
    <tr><th>Corista</th><th>Presenze</th><th>Assenze</th><th>% presenza</th></tr>
    ${C.people.map((n,i)=>{const c=counts(ch,i,null);const tot=c.p+c.a;const ex=C.exempt.includes(n);
      return `<tr><td class="l"><b>${n}</b></td><td><span class="pill P">${c.p}</span></td><td><span class="pill A">${c.a}</span></td>
      <td>${tot?Math.round(c.p/tot*100)+'%':'—'}</td></tr>`;}).join('')}
  </table></div></div>`;
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mIdx[ch]=+b.dataset.m;renderChoir(ch);});
  document.querySelectorAll('.cell').forEach(b=>b.onclick=()=>{
    const d=b.dataset.d,i=b.dataset.i,o=S[ch].att[d]=S[ch].att[d]||{}; const cur=o[i]||'';
    const nx=cur===''?'P':cur==='P'?'A':''; if(nx) o[i]=nx; else delete o[i];
    save(); renderChoir(ch); });
  document.querySelectorAll('[data-all]').forEach(b=>b.onclick=()=>{
    const o=S[ch].att[b.dataset.all]=S[ch].att[b.dataset.all]||{}; C.people.forEach((_,i)=>o[i]='P'); save(); renderChoir(ch); });
  document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>{
    const o=S[ch].pay[mk]=S[ch].pay[mk]||{}; if(b.dataset.on==='1')delete o[b.dataset.pay]; else o[b.dataset.pay]=true; syncPayments(); renderChoir(ch); });
  window.scrollTo(0,sy);
}

syncPayments();
render();
</script>
</body>
</html>
