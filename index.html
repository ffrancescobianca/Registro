<style>
:root{color-scheme:light;--bg:#f3f8fd;--card:#ffffff;--tx:#16294d;--mut:#64799c;--bd:#dbe7f4;--ac:#3788e7;--acl:#e4f0ff;--in:#2b8a57;--out:#c4533f;--okb:#e3f5ea;--kob:#fdeae6;--nv:#1d3b8b;--pt:#1f56b8;--pbd:#8dbcf3;--teal:#4ed7ca;--or:#ff905e;--or2:#ff7a66;--grad:linear-gradient(135deg,#34a0da,#3a70f4);--grad2:linear-gradient(135deg,#4ed7ca,#3788e7 60%,#3a70f4);--grado:linear-gradient(135deg,#ff905e,#ff7a66)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(180deg,#dcf5f3 0,#eaf3fd 280px,#f3f8fd 100%) fixed;color:var(--tx)}
h2{font-size:17px;margin:0 0 10px;color:var(--nv)}
main{max-width:1100px;margin:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 12px calc(110px + env(safe-area-inset-bottom,0px))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 2px 12px rgba(55,136,231,.12)}
.card.tight{padding:14px 8px}
.card.tight h2{padding:0 6px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.row label{flex:1 1 140px}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:3px}
input,select{font:inherit;padding:8px;border:1px solid var(--bd);border-radius:10px;background:#f7fbff;color:var(--tx);min-width:0}
.btn{padding:9px 16px;border:0;border-radius:10px;background:var(--grad);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:var(--acl);color:var(--pt)}
.btn.sm{padding:3px 8px;font-size:12px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;border-bottom:1px solid var(--bd);text-align:center;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--mut);font-weight:600}
td.l{text-align:left}
.greet{margin:4px 4px 18px}
.gh{font-family:Georgia,'Palatino Linotype',Palatino,serif;font-size:24px;font-weight:700;line-height:1.2;color:var(--nv)}
.gs{font-size:19px;margin-top:4px;color:var(--mut)}
.gs b{color:var(--or2);font-weight:700}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;box-shadow:0 2px 12px rgba(55,136,231,.12)}
.kpi small{color:var(--mut);display:block}.kpi b{font-size:21px}
.kpi.pat{background:var(--grad2);border:0;color:#fff;margin-bottom:0;padding:18px 20px}
.kpi.pat small{color:rgba(255,255,255,.85)}.kpi.pat b{font-size:28px}
.in{color:var(--in)}.out{color:var(--out)}
.months{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px;padding:0 6px}
.months button{padding:6px 12px;border:1px solid var(--bd);border-radius:20px;background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
.months button.on{background:var(--grad);color:#fff;border-color:transparent}
.cell{width:38px;height:34px;border:1px solid var(--bd);border-radius:9px;background:#f7fbff;color:var(--mut);font:inherit;font-weight:700;cursor:pointer}
.cell.P{background:var(--okb);color:var(--in);border-color:var(--in)}
.cell.A{background:var(--kob);color:var(--out);border-color:var(--out)}
.hint{color:var(--mut);font-size:13px;margin:0 0 10px}
.pill{display:inline-block;min-width:26px;padding:2px 8px;border-radius:12px;font-weight:700}
.pill.P{background:var(--okb);color:var(--in)}.pill.A{background:var(--kob);color:var(--out)}
.d{font-size:11px;color:var(--mut);display:block;font-weight:400}

/* registro presenze */
.reg{table-layout:fixed;width:100%}
.reg th,.reg td{padding:6px 1px;white-space:normal;vertical-align:middle}
.reg th:first-child,.reg td:first-child{width:86px;padding-left:6px;position:sticky;left:0;background:var(--card);z-index:1}
.reg th{line-height:1.15;font-size:11px}
.reg th .d{font-size:9.5px}
.reg .cell{width:100%;max-width:38px;min-width:0;height:34px;padding:0;border-radius:8px}
.allbtn{width:24px;height:22px;margin-top:4px;padding:0;border:0;border-radius:7px;background:var(--okb);color:var(--in);font:inherit;font-size:11px;font-weight:800;cursor:pointer}
.sn{display:block;font-size:11.5px;line-height:1.1;white-space:nowrap;letter-spacing:-.2px}
.gn{display:block;font-size:11px;color:var(--mut);line-height:1.2;white-space:nowrap}
.mini{display:flex;gap:3px;margin:3px 0}
.mini .pill{min-width:0;padding:0 6px;font-size:11px;line-height:1.5}
.reg th:last-child,.reg td:last-child{width:36px;padding-left:2px;padding-right:4px}
.pay{width:100%;height:34px;padding:0;border:1px solid var(--pbd);border-radius:8px;background:#fff;color:var(--pt);cursor:pointer}
.pay svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;display:block;margin:auto}
.pay.on{background:var(--grado);border-color:transparent;color:#fff}
.ex{font-size:9.5px;color:var(--mut)}

/* coristi */
.pr{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}
.pr:last-child{border-bottom:0}
.pr .pnm{flex:1;min-width:0}
.sw{flex-direction:row;align-items:center;gap:8px;font-size:13px;color:var(--tx)}
.sw input{-webkit-appearance:none;appearance:none;width:44px;height:26px;padding:0;border:0;border-radius:13px;background:#cfdcec;position:relative;cursor:pointer;transition:background .2s}
.sw input::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.sw input:checked{background:var(--grado)}
.sw input:checked::after{left:21px}

/* pannello coristi (si apre dall'icona ⚙️) */
.chead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.chead h2{margin:0}
.gear{flex:none;width:40px;height:40px;border:0;border-radius:50%;background:var(--acl);cursor:pointer;font-size:19px;line-height:1;display:flex;align-items:center;justify-content:center;transition:background .2s,box-shadow .2s}
.gear .gi{display:inline-block;transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
.gear.on{background:var(--pbd);box-shadow:0 3px 10px rgba(55,136,231,.3)}
.gear.on .gi{transform:rotate(180deg)}
.cwrap{display:grid;grid-template-rows:0fr;opacity:0;visibility:hidden;margin-top:0;transform:translateY(-8px);scroll-margin-bottom:110px;
  transition:grid-template-rows .4s ease,opacity .3s ease,margin-top .4s ease,transform .4s ease,visibility 0s .4s}
.cwrap.open{grid-template-rows:1fr;opacity:1;visibility:visible;margin-top:16px;transform:none;transition-delay:0s}
.cin{overflow:hidden;min-height:0}
.cbox{border-top:1px solid var(--bd);padding-top:16px}
@media (prefers-reduced-motion:reduce){.cwrap,.gear .gi{transition:none}}

/* movimenti */
.mv{padding:11px 0;border-bottom:1px solid var(--bd)}
.mv:last-child{border-bottom:0}
.mv1{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.mv1 .t{font-weight:700;word-break:break-word}
.mv1 .a{white-space:nowrap;font-weight:700}
.mv3{display:flex;align-items:center;gap:8px;margin-top:6px}
.nt{flex:1;min-width:0;font-size:13px;color:var(--pt);background:var(--acl);padding:6px 10px;border-radius:10px;word-break:break-word}
.acts{display:flex;align-items:center;gap:6px;margin-left:auto}
.acts .btn{height:34px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;line-height:1}
.acts .btn.ic{width:40px;padding:0}
.pen{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}

/* barra in basso stile Dynamic Island */
nav{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;display:flex;gap:6px;padding:6px;border-radius:999px;background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid #cfe0f3;box-shadow:0 10px 28px rgba(55,136,231,.3),0 2px 6px rgba(22,41,77,.1)}
nav button{width:56px;height:46px;display:flex;align-items:center;justify-content:center;border:0;border-radius:999px;background:transparent;color:#7fa6d6;cursor:pointer;transition:width .25s ease,background .2s,color .2s}
nav button svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button.on{width:76px;background:var(--grad2);color:#fff;box-shadow:0 4px 12px rgba(55,136,231,.4)}

/* benvenuto */
body.home nav{display:none}
.welcome{min-height:100vh;min-height:100dvh;margin-top:-20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;animation:wfade 1.1s ease both}
.wline{width:56px;height:2px;border-radius:2px;background:var(--grad2)}
.wtitle{font-family:Georgia,'Palatino Linotype',Palatino,serif;font-weight:400;font-size:34px;line-height:1.25;color:var(--nv);margin:34px 0}
.wtitle small{display:block;font-size:12px;letter-spacing:6px;text-transform:uppercase;color:var(--or2);font-family:system-ui,-apple-system,sans-serif;font-weight:700;margin-bottom:14px}
.wenter{margin-top:46px;padding:13px 44px;border:0;border-radius:999px;background:var(--grado);color:#fff;font:inherit;font-size:13px;font-weight:700;letter-spacing:3px;text-transform:uppercase;cursor:pointer;box-shadow:0 8px 20px rgba(255,122,102,.4)}
@keyframes wfade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.welcome{animation:none}}
</style>
</head>
<body>
<nav id="nav" aria-label="Sezioni">
  <button data-t="pn" aria-label="Piccole Note" title="Piccole Note"><svg viewBox="0 0 24 24"><path d="M9.5 17V6.5l10-2.2V15"/><path d="M9.5 9.2l10-2.2" stroke-width="3"/><ellipse cx="7" cy="17.3" rx="3" ry="2.3" fill="currentColor" transform="rotate(-20 7 17.3)"/><ellipse cx="17" cy="15.3" rx="3" ry="2.3" fill="currentColor" transform="rotate(-20 17 15.3)"/></svg></button>
  <button data-t="fin" aria-label="Portafoglio" title="Portafoglio"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h13v3"/><path d="M3 7v11a2 2 0 0 0 2 2h14a1 1 0 0 0 1-1V9a1 1 0 0 0-1-1H5a2 2 0 0 1-2-1z"/><circle cx="16.5" cy="14" r="1.2"/></svg></button>
  <button data-t="on" aria-label="Oltre le Note" title="Oltre le Note"><svg viewBox="0 0 24 24"><path d="M14.5 16.5V3.5"/><ellipse cx="11.8" cy="17.5" rx="3.4" ry="2.7" fill="currentColor" transform="rotate(-20 11.8 17.5)"/></svg></button>
</nav>
<main id="app"></main>

<script>
/* ===== CONFIGURAZIONE ===== */
const SEASON_START_YEAR = 2026;           // anno di inizio lezioni (novembre)
const MONTHS = [[0,10],[0,11],[1,0],[1,1],[1,2],[1,3],[1,4],[1,5]]; // [offset anno, mese 0-11]: nov → giu
const MN = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
const DN = ['Dom','Lun','Mar','Mer','Gio','Ven','Sab'];
const CHOIRS = { pn:{name:'Piccole Note', days:[6]}, on:{name:'Oltre le Note', days:[2,6]} };
// elenchi iniziali (poi i coristi si gestiscono dall'app)
const OLD = {
  pn:['BOCCACCIO Virginia','COFFA Noemi','GIANNUSO Giulia','MARINO Emanuele','PASSARELLO Aurora'],
  on:['AUTERI Monica','BONAIUTO Alessandro','BONAIUTO Noemi','CAIA Annamaria','CAIA Lucrezia','CANCEMI Claudia','GRECO Matteo','SCOLLO Benedetta','TIRALONGO Giada']
};
const OLD_EX = { pn:[], on:['AUTERI Monica','CANCEMI Claudia','GRECO Matteo','TIRALONGO Giada','CAIA Annamaria'] };
// Giorni senza lezione oltre alle festività nazionali (formato AAAA-MM-GG), es. ponti o chiusure
const NO_LESSON = ['2027-01-02'];
const HOL = [[0,1],[0,2],[0,6],[3,25],[4,1],[5,2],[7,15],[10,1],[11,8],[11,25],[11,26]]; // [mese 0-11, giorno]
function easterMonday(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),
  h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
  mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1; return new Date(y,mo-1,da+1);}
function isHoliday(d){
  if(HOL.some(([m,g])=>d.getMonth()===m&&d.getDate()===g)) return true;
  const p=easterMonday(d.getFullYear()); if(p.getMonth()===d.getMonth()&&p.getDate()===d.getDate()) return true;
  return NO_LESSON.includes(iso(d));
}
const FEE = 20; // quota mensile in €
const KEY = 'gestionale-v1';

/* ===== STATO ===== */
let S = {fin:{items:[]}, pn:{att:{},pay:{}}, on:{att:{},pay:{}}};
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} };
try{ const r = localStorage.getItem(KEY); if(r) S = Object.assign(S, JSON.parse(r)); }catch(e){}
(function migrate(){
  if(!S.fin||!Array.isArray(S.fin.items)) S.fin={items:[]};
  ['pn','on'].forEach(ch=>{
    const st=S[ch]=S[ch]||{}; st.att=st.att||{}; st.pay=st.pay||{};
    if(Array.isArray(st.people)) return;
    // vecchio formato (chiavi = numero di riga) -> chiavi = nome del corista
    const old=OLD[ch];
    st.people=old.map(n=>({n,ex:OLD_EX[ch].includes(n)}));
    Object.keys(st.att).forEach(d=>{const o=st.att[d],m={};Object.keys(o).forEach(i=>{if(old[i]) m[old[i]]=o[i];});st.att[d]=m;});
    Object.keys(st.pay).forEach(mk=>{const o=st.pay[mk],m={};Object.keys(o).forEach(i=>{if(old[i]&&o[i]) m[old[i]]=true;});st.pay[mk]=m;});
    S.fin.items.forEach(it=>{ if(it.link){const [c,mk,i]=it.link.split('|'); if(c===ch&&/^\d+$/.test(i)&&old[i]!==undefined) it.link=c+'|'+mk+'|'+old[i];}});
  });
  save();
})();
let tab='home', mIdx={pn:0,on:0}, gOpen={pn:false,on:false};

/* ===== CORISTI ===== */
const sorted = ch => S[ch].people.slice().sort((a,b)=>a.n.localeCompare(b.n,'it'));
const splitName = n => { const sp=n.indexOf(' '); return sp<0?[n,'']:[n.slice(0,sp),n.slice(sp+1)]; };
const niceName = n => { const [sn,g]=splitName(n); return (g+' '+sn.charAt(0)+sn.slice(1).toLowerCase()).trim(); };
const normName = raw => { const t=raw.trim().split(/\s+/).filter(Boolean); if(!t.length) return '';
  return (t[0].toUpperCase()+' '+t.slice(1).map(w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()).join(' ')).trim(); };

/* Mensilità pagate -> movimenti automatici nel portafoglio */
const payDesc = ch => 'Mensilità Coro “'+CHOIRS[ch].name+'”';
const payNote = (ch,mk,n) => niceName(n)+' ha pagato la mensilità di '+MN[+mk.slice(5)-1]+' '+mk.slice(0,4);
function syncPayments(){
  const want={};
  ['pn','on'].forEach(ch=>{
    const ok=new Set(S[ch].people.filter(p=>!p.ex).map(p=>p.n));
    Object.keys(S[ch].pay).forEach(mk=>Object.keys(S[ch].pay[mk]).forEach(n=>{
      if(S[ch].pay[mk][n]&&ok.has(n)) want[ch+'|'+mk+'|'+n]={ch,mk,n};
    }));
  });
  const has={};
  S.fin.items=S.fin.items.filter(it=>{
    if(!it.link) return true;
    if(!want[it.link]||has[it.link]) return false;   // pagamento tolto (o doppione)
    has[it.link]=1;
    const [lc,lm,...ln]=it.link.split('|'); it.desc=payDesc(lc); if(it.note===undefined) it.note=payNote(lc,lm,ln.join('|'));
    return true;
  });
  Object.keys(want).forEach(k=>{
    if(has[k]) return;
    const {ch,mk,n}=want[k];
    S.fin.items.push({id:Date.now()+''+Math.random().toString(36).slice(2,6),link:k,date:iso(new Date()),type:'in',cat:'',
      desc:payDesc(ch),note:payNote(ch,mk,n),amt:FEE});
  });
  save();
}

/* ===== UTILITÀ ===== */
const $ = s => document.querySelector(s);
const eur = n => (n||0).toLocaleString('it-IT',{style:'currency',currency:'EUR'});
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const mKey = k => { const [o,m]=MONTHS[k]; return (SEASON_START_YEAR+o)+'-'+String(m+1).padStart(2,'0'); };
function lessons(ch,k){
  const [o,m]=MONTHS[k], y=SEASON_START_YEAR+o, out=[];
  for(let d=new Date(y,m,1); d.getMonth()===m; d.setDate(d.getDate()+1))
    if(CHOIRS[ch].days.includes(d.getDay())&&!isHoliday(d)) out.push(new Date(d));
  return out;
}

/* ===== NAVIGAZIONE ===== */
$('#nav').onclick = e => { const b=e.target.closest('button'); if(!b) return;
  tab=b.dataset.t; window.scrollTo(0,0); document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b)); render(); };

function render(){ document.body.classList.toggle('home',tab==='home'); tab==='home'?renderHome():tab==='fin'?renderFin():renderChoir(tab); }

/* ===== BENVENUTO ===== */
function renderHome(){
  $('#app').innerHTML=`<div class="welcome">
    <div class="wline"></div>
    <h2 class="wtitle"><small>Benvenuto</small>M° Francesco Bianca</h2>
    <div class="wline"></div>
    <button class="wenter" id="enter">Entra</button>
  </div>`;
  $('#enter').onclick=()=>document.querySelector('nav button[data-t="fin"]').click();
}

/* ===== 1) PORTAFOGLIO ===== */
function renderFin(){
  const items=S.fin.items.slice().sort((a,b)=>b.date.localeCompare(a.date));
  const tin=items.filter(i=>i.type==='in').reduce((s,i)=>s+i.amt,0);
  const tout=items.filter(i=>i.type==='out').reduce((s,i)=>s+i.amt,0);
  const months=[...new Set(items.map(i=>i.date.slice(0,7)))].sort();
  let run=0;
  const summary=months.map(m=>{
    const a=items.filter(i=>i.date.startsWith(m)&&i.type==='in').reduce((s,i)=>s+i.amt,0);
    const b=items.filter(i=>i.date.startsWith(m)&&i.type==='out').reduce((s,i)=>s+i.amt,0);
    run+=a-b; return {m,a,b,run};
  });
  $('#app').innerHTML=`
  <div class="greet"><div class="gh">Benvenuto M° Francesco Bianca,</div><div class="gs">ecco il tuo <b>${MN[new Date().getMonth()]}</b></div></div>
  <div class="kpis">
    <div class="kpi"><small>Entrate totali</small><b class="in">${eur(tin)}</b></div>
    <div class="kpi"><small>Uscite totali</small><b class="out">${eur(tout)}</b></div>
  </div>
  <div class="card"><h2>Nuovo movimento</h2>
    <div class="row">
      <label>Data<input type="date" id="fd" value="${iso(new Date())}"></label>
      <label>Tipo<select id="ft"><option value="in">Entrata</option><option value="out">Uscita</option></select></label>
      <label>Descrizione<input id="fx" placeholder="es. Affitto"></label>
      <label>Importo (€)<input type="number" id="fa" step="0.01" min="0"></label>
      <label style="flex-basis:100%">Nota (facoltativa)<input id="fn" placeholder="es. pagato in contanti"></label>
      <button class="btn" id="fadd">Aggiungi</button>
    </div>
  </div>
  <div class="card"><h2>Riepilogo mensile</h2><div class="scroll"><table>
    <tr><th>Mese</th><th>Entrate</th><th>Uscite</th><th>Saldo</th><th>Patrimonio</th></tr>
    ${summary.map(r=>`<tr><td>${MN[+r.m.slice(5)-1]} ${r.m.slice(0,4)}</td><td class="in">${eur(r.a)}</td><td class="out">${eur(r.b)}</td><td>${eur(r.a-r.b)}</td><td><b>${eur(r.run)}</b></td></tr>`).join('')||'<tr><td colspan="5" class="l">Nessun movimento.</td></tr>'}
  </table></div></div>
  <div class="card"><h2>Movimenti</h2>
    ${items.map(i=>`<div class="mv">
      <div class="mv1"><span class="t">${esc(i.desc||'Movimento')}</span><span class="a ${i.type}">${i.type==='in'?'+':'−'}${eur(i.amt)}</span></div>
      <span class="d">${i.date.split('-').reverse().join('/')}</span>
      <div class="mv3">${i.note?`<span class="nt">${esc(i.note)}</span>`:''}
        <div class="acts"><button class="btn sec ${i.note?'ic':''}" data-note="${i.id}" ${i.note?'aria-label="Modifica nota" title="Modifica nota"':''}>${i.note?'<svg class="pen" viewBox="0 0 24 24"><path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19z"/><path d="M14.5 6.5l3 3"/></svg>':'+ Nota'}</button>${i.link?'':`<button class="btn sec" data-del="${i.id}">Elimina</button>`}</div>
      </div></div>`).join('')||'<p class="hint">Nessun movimento.</p>'}
  </div>
  <div class="kpi pat"><small>Patrimonio attuale</small><b>${eur(tin-tout)}</b></div>
`;
  document.querySelectorAll('[data-note]').forEach(b=>b.onclick=()=>{
    const it=S.fin.items.find(x=>x.id===b.dataset.note); if(!it) return;
    const v=prompt('Nota del movimento:',it.note||''); if(v===null) return;
    if(v.trim()) it.note=v.trim(); else delete it.note; save(); renderFin(); });
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    if(!confirm('Eliminare questo movimento?')) return;
    S.fin.items=S.fin.items.filter(x=>x.id!==b.dataset.del); save(); renderFin(); });
  $('#fadd').onclick=()=>{
    const amt=parseFloat($('#fa').value); if(!(amt>0)||!$('#fd').value){alert('Inserisci data e importo valido.');return;}
    S.fin.items.push({id:Date.now()+''+Math.random().toString(36).slice(2,6),date:$('#fd').value,type:$('#ft').value,cat:'',desc:$('#fx').value,note:$('#fn').value.trim()||undefined,amt});
    save(); renderFin(); };
}

/* ===== 2 e 3) CORI ===== */
function counts(ch,n,k){ // presenze/assenze per corista; k = indice mese oppure null per tutta la stagione
  let p=0,a=0;
  (k===null?MONTHS.map((_,j)=>j):[k]).forEach(j=>lessons(ch,j).forEach(d=>{
    const v=(S[ch].att[iso(d)]||{})[n]; if(v==='P')p++; else if(v==='A')a++; }));
  return {p,a};
}
function renderChoir(ch){
  const sy=window.scrollY;
  const C=CHOIRS[ch], k=mIdx[ch], L=lessons(ch,k), mk=mKey(k), P=sorted(ch);
  $('#app').innerHTML=`
  <div class="card tight"><h2>Coro “${C.name}”</h2>
    <div class="months">${MONTHS.map((_,j)=>`<button data-m="${j}" class="${j===k?'on':''}">${MN[MONTHS[j][1]]}</button>`).join('')}</div>
    <div class="scroll"><table class="reg">
      <tr><th></th>${L.map(d=>`<th>${DN[d.getDay()]}<span class="d">${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}</span>
        <button class="allbtn" data-all="${iso(d)}" title="Tutti presenti">P</button></th>`).join('')}<th>€</th></tr>
      ${P.map(p=>{const n=p.n,c=counts(ch,n,k),paid=(S[ch].pay[mk]||{})[n],[sn,gn]=splitName(n);return `<tr><td><b class="sn">${esc(sn)}</b><span class="gn">${esc(gn)}</span>
        <span class="mini"><span class="pill P">${c.p}</span><span class="pill A">${c.a}</span></span></td>
        ${L.map(d=>{const v=(S[ch].att[iso(d)]||{})[n]||'';return `<td><button class="cell ${v}" data-d="${iso(d)}" data-i="${esc(n)}">${v||'·'}</button></td>`;}).join('')}
        <td>${p.ex?'<span class="ex">Esente</span>':`<button class="pay ${paid?'on':''}" data-pay="${esc(n)}" data-on="${paid?1:0}" aria-label="${paid?'Mensilità pagata':'Mensilità da pagare'}" title="${paid?'Mensilità pagata':'Mensilità da pagare'}"><svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/><path d="M6 9.5v.01M18 14.5v.01"/></svg></button>`}</td></tr>`;}).join('')}
    </table></div>
  </div>
  <div class="card"><div class="chead"><h2>Registro Coro “${C.name}”</h2><button class="gear ${gOpen[ch]?'on':''}" id="gear" aria-label="Gestisci coristi" aria-expanded="${gOpen[ch]}" aria-controls="cwrap" title="Coristi"><span class="gi">⚙️</span></button></div><div class="scroll"><table>
    <tr><th>Corista</th><th>Presenze</th><th>Assenze</th><th>% presenza</th></tr>
    ${P.map(p=>{const c=counts(ch,p.n,null);const tot=c.p+c.a;
      return `<tr><td class="l"><b>${esc(p.n)}</b></td><td><span class="pill P">${c.p}</span></td><td><span class="pill A">${c.a}</span></td>
      <td>${tot?Math.round(c.p/tot*100)+'%':'—'}</td></tr>`;}).join('')}
  </table></div>
  <div class="cwrap ${gOpen[ch]?'open':''}" id="cwrap"><div class="cin"><div class="cbox"><h2>Coristi</h2>
    <div class="row"><label style="flex:1 1 180px">Nuovo corista<input id="np" placeholder="Cognome Nome" autocapitalize="words" autocomplete="off"></label><button class="btn" id="npadd">Aggiungi</button></div>
    <p class="hint" style="margin:14px 0 2px">Attiva “Esonerato” per chi non paga la mensilità.</p>
    ${P.map(p=>{const [sn,gn]=splitName(p.n);return `<div class="pr"><span class="pnm"><b>${esc(sn)}</b> ${esc(gn)}</span>
      <label class="sw"><input type="checkbox" data-ex="${esc(p.n)}" ${p.ex?'checked':''}><span>Esonerato</span></label>
      <button class="btn sec sm" data-rm="${esc(p.n)}" aria-label="Rimuovi corista" title="Rimuovi corista" style="height:34px;width:34px">✕</button></div>`;}).join('')}
  </div></div></div></div>`;
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mIdx[ch]=+b.dataset.m;renderChoir(ch);});
  document.querySelectorAll('.cell').forEach(b=>b.onclick=()=>{
    const d=b.dataset.d,n=b.dataset.i,o=S[ch].att[d]=S[ch].att[d]||{}; const cur=o[n]||'';
    const nx=cur===''?'P':cur==='P'?'A':''; if(nx) o[n]=nx; else delete o[n];
    save(); renderChoir(ch); });
  document.querySelectorAll('[data-all]').forEach(b=>b.onclick=()=>{
    const o=S[ch].att[b.dataset.all]=S[ch].att[b.dataset.all]||{}; P.forEach(p=>o[p.n]='P'); save(); renderChoir(ch); });
  document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=()=>{
    const o=S[ch].pay[mk]=S[ch].pay[mk]||{}; if(b.dataset.on==='1')delete o[b.dataset.pay]; else o[b.dataset.pay]=true; syncPayments(); renderChoir(ch); });
  const add=()=>{
    const n=normName($('#np').value); if(!n){alert('Scrivi cognome e nome del corista.');return;}
    if(S[ch].people.some(p=>p.n.toLowerCase()===n.toLowerCase())){alert('Questo corista è già presente.');return;}
    S[ch].people.push({n,ex:false}); save(); renderChoir(ch); };
  $('#npadd').onclick=add; $('#np').onkeydown=e=>{ if(e.key==='Enter') add(); };
  document.querySelectorAll('[data-ex]').forEach(b=>b.onchange=()=>{
    const p=S[ch].people.find(x=>x.n===b.dataset.ex); if(!p) return; p.ex=b.checked; syncPayments(); renderChoir(ch); });
  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{
    const n=b.dataset.rm;
    if(!confirm('Rimuovere '+niceName(n)+'? Verranno eliminati anche presenze, pagamenti e le relative entrate nel portafoglio.')) return;
    S[ch].people=S[ch].people.filter(x=>x.n!==n);
    Object.keys(S[ch].att).forEach(d=>delete S[ch].att[d][n]);
    Object.keys(S[ch].pay).forEach(m=>delete S[ch].pay[m][n]);
    syncPayments(); renderChoir(ch); });
  $('#gear').onclick=()=>{
    gOpen[ch]=!gOpen[ch]; const w=$('#cwrap'), g=$('#gear');
    w.classList.toggle('open',gOpen[ch]); g.classList.toggle('on',gOpen[ch]); g.setAttribute('aria-expanded',gOpen[ch]);
    if(gOpen[ch]) setTimeout(()=>w.scrollIntoView({behavior:'smooth',block:'nearest'}),420); };
  window.scrollTo(0,sy);
}

syncPayments();
render();
</script>
</body>
</html>
